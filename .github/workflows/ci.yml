name: Highport CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: highport
          POSTGRES_PASSWORD: highport_dev
          POSTGRES_DB: highport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U highport -d highport_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://highport:highport_dev@localhost:5432/highport_test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install
      - name: Check for leaked secrets
        run: |
          if grep -r "AIzaSy\|pcsk_\|sk-" --include="*.ts" --include="*.tsx" --include="*.env" --include="*.py" . --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
            echo "ERROR: Possible secrets found in codebase!"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter server db:migrate
      - run: pnpm test
      - run: pnpm build
      # TODO: Add E2E tests (pnpm e2e) after browser setup step
      # Requires: npx playwright install chromium
      # See: apps/web/e2e/ for test definitions
