services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '18123:5432'
    environment:
      POSTGRES_USER: highport
      POSTGRES_PASSWORD: highport_dev
      POSTGRES_DB: highport_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U highport -d highport_test']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
