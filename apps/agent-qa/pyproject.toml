[project]
name = "agent-qa"
version = "0.1.0"
description = "Agentic test harness for Highport Tier 1 (multi-player chargen) — drives an AI agent through charters, asserts FSM outcomes, scores UI readability."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Highport Engineering" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
agent = [
    "browser-use>=0.10",
    "playwright>=1.44",
    "anthropic>=0.30",
]
all = [
    "agent-qa[test,agent]",
]

[project.scripts]
agent-qa = "agent_qa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_qa"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests that hit real or mock external services",
    "slow: marks tests that take >1s",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent_qa", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "RUF",                # ruff-specific
    "SIM",                # simplify
    "C4",                 # comprehensions
]
ignore = [
    "E501",               # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
