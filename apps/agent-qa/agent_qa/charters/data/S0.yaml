id: S0
title: Harness smoke test
version: 1
enabled: true
tags: [smoke, harness]
areas: [boot]
timebox_minutes: 5
mission: |
  Sign in as a test player, navigate to /chargen, and verify the wizard shell renders with the background step visible.

persona:
  primary: player
  secondary: null
  critic: null

preconditions:
  services_required: [web, fastify]
  services_optional: [hocuspocus, postgres, rag, ollama]
  services_prohibited: []
  seed_data: {}
  session_config: {}

fsm_expectations: []
boundary_invariants:
  - {
      id: chargen_shell_text,
      kind: regex_present,
      pattern: 'Background|Character Gen|ChargenWizard',
    }
  - {
      id: wizard_shell_visible,
      kind: element_visible,
      filter: 'button:has-text("Create New Character")',
    }
  - { id: chargen_url, kind: url_matches, pattern: '/chargen' }
  - { id: no_uncaught_exception, kind: exact, expect: 0 }
behavioral_checks: []

success_criteria:
  required: [login_completed, chargen_page_loaded, wizard_shell_visible, report_written]

login:
  required: true
  user_role: player1

budget:
  max_steps: 8
  max_tokens_per_step: 500
  max_total_tokens: 5000
  max_wall_clock_s: 120
  retry_on_infra_failure: 0

evidence:
  screenshots: per_step
  action_tape: jsonl
  dom_snapshots: on_assertion_failure
  video: 'off'

known_failure_modes: []
xfail: false
