id: A1
title: Session presence — players see each other
mission: >
  Verify that when two players navigate to /chargen simultaneously,
  both see each other in the participant panel within 10 seconds.
version: 1
enabled: true
tags: [presence, multiplayer, foundational]
areas: [chargen, collaboration]
timebox_minutes: 5

persona:
  primary: player
  secondary: null
  critic: null

personas:
  mode: sequential
  roles:
    - persona_id: player
      user_role: player1
      mission: >
        Sign in as player1, navigate to /chargen, start character creation
        (click "Create New Character" if needed), then WAIT on the wizard
        shell for 15 seconds. Do NOT proceed past the background step.
        Take a screenshot of the participant panel.
      max_steps: 8
    - persona_id: player
      user_role: player2
      mission: >
        Sign in as player2, navigate to /chargen. Look for the participant
        panel (usually on the left side). Take a screenshot showing all
        participants. Report the names of all participants you can see.
      max_steps: 8

preconditions:
  services_required: [web, fastify, hocuspocus]
  services_optional: [postgres, ollama]
  services_prohibited: []
  seed_data: {}
  session_config: {}

fsm_expectations: []
boundary_invariants:
  - id: player2_sees_player1
    kind: regex_present
    description: Player 2's browser shows player1 in participant panel
    expected: 'player1|Agent QA player1'
    target: player2
    selector: "[data-testid='participant-panel'], .participant-panel, aside"
  - id: no_uncaught_exception
    kind: exact
    description: No uncaught JavaScript exceptions in either browser
    expected: 0
behavioral_checks: []

success_criteria:
  required:
    - Both players reach /chargen without errors
    - Player 2's DOM contains player1's name in participant panel
    - No uncaught exceptions in either browser

budget:
  max_steps: 20
  max_tokens_per_step: 2000
  max_total_tokens: 50000
  max_wall_clock_s: 180
  retry_on_infra_failure: 0

evidence:
  screenshots: per_step
  action_tape: jsonl
  dom_snapshots: on_assertion_failure
  video: 'off'

known_failure_modes: []
xfail: false
